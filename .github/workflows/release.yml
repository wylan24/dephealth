name: release
# Push a version tag (git tag v0.4.0 && git push origin v0.4.0) after bumping package.json.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write   # GitHub release + moving the major Action tag
  id-token: write   # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Tag must match package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"; exit 1; fi

      # prepublishOnly runs typecheck, tests and build. With npm trusted publishing configured for this
      # workflow no token is needed; otherwise set an NPM_TOKEN secret (automation token).
      - name: Publish to npm
        # skipped when this version is already on npm (e.g. the first release, published by hand)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then echo "$name@$version is already on npm; skipping"; exit 0; fi
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "dephealth $GITHUB_REF_NAME"

      - name: Move the major tag that Action users pin to (wylan24/dephealth@vN)
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "$major"
